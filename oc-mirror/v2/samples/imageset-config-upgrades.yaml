kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  platform:
    channels:
      # Keep existing version to ensure current cluster images remain available/valid
      - name: stable-4.18
        minVersion: 4.18.10
        maxVersion: 4.18.10
        shortestPath: true
      # Add target version for the upgrade
      - name: stable-4.19
        minVersion: 4.19.0
        maxVersion: 4.19.2
        shortestPath: true
  operators:
    # Existing catalog for 4.18
    - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.18
      packages:
        - name: web-terminal
          channels:
            - name: fast
    # New catalog for 4.19
    - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.19
      packages:
        - name: web-terminal
          channels:
            - name: fast
