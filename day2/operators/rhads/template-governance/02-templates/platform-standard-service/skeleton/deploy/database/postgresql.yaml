# Optional PostgreSQL database deployment.
# Included when developer enables the database toggle.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.serviceName }}-db
  namespace: {% if values.namespace %}${{ values.namespace }}{% else %}${{ values.serviceName }}{% endif %}
  labels:
    app.kubernetes.io/name: ${{ values.serviceName }}-db
    app.kubernetes.io/part-of: ${{ values.serviceName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.serviceName }}-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${{ values.serviceName }}-db
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-15:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ values.serviceName }}-db-credentials
                  key: username
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ values.serviceName }}-db-credentials
                  key: password
            - name: POSTGRESQL_DATABASE
              value: ${{ values.serviceName }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ${{ values.serviceName }}-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ values.serviceName }}-db
  namespace: {% if values.namespace %}${{ values.namespace }}{% else %}${{ values.serviceName }}{% endif %}
spec:
  selector:
    app.kubernetes.io/name: ${{ values.serviceName }}-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${{ values.serviceName }}-db-pvc
  namespace: {% if values.namespace %}${{ values.namespace }}{% else %}${{ values.serviceName }}{% endif %}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
