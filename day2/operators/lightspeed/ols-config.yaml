    #    initialQuota: 100000
    #    quotaIncrease: 1000
    #    period: 30 days
    #  - name: cluster_limits
    #    type: cluster_limiter
    #    initialQuota: 1000000
    #    quotaIncrease: 100000
    #    period: 30 days
  olsDataCollector:
    logLevel: INFO
