---
# defaults file for quay

base_dir: '/opt/openshift/quay'
quay_pod_name: 'quay-pod'

mysql_dir: '{{ base_dir }}/mysql'
mysql_container_name: 'quay-mysql'
mysql_database: 'enterpriseregistrydb'
mysql_password: 'CHANGEME'
mysql_user: 'quayuser'
mysql_root_password: 'CHANGEME'
redis_dir: '{{ base_dir }}/redis'
redis_container_name: 'quay-redis'
quay_container_name: 'quay'
quay_password: 'CHANGEME'  # password hash for the Quay user
quay_config_mode: false
quay_hostname: 'quay.redhatgovic.io'
quay_SAN: 'DNS:quay.redhatgovic.io'
